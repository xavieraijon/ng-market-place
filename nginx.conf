server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un fichero real devuelve index.html (p. ej. /cart al recargar)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los ficheros compilados llevan hash en el nombre: se pueden cachear mucho tiempo
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca en caché, para que se vean los despliegues nuevos al momento
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
